version: '3.8'

services:
  # 1. 业务数据库服务 (PostgreSQL 15 Alpine 轻量生产级)
  db:
    image: postgres:15-alpine
    container_name: party-postgres-db
    restart: always
    environment:
      POSTGRES_DB: honghe_party_db
      POSTGRES_USER: party_user
      POSTGRES_PASSWORD: Party@Honghe2025
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次启动自动执行初始化建表与红河数据产业集团种子数据
      - ./docs/schema-pg.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party_user -d honghe_party_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - party-network

  # 2. 智慧党建核心业务后端 (Spring Boot 3 + Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: party-building-backend:1.0.0
    container_name: party-spring-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/honghe_party_db?currentSchema=public&useUnicode=true&characterEncoding=utf-8
      SPRING_DATASOURCE_USERNAME: party_user
      SPRING_DATASOURCE_PASSWORD: Party@Honghe2025
      PARTY_UPLOAD_PATH: /app/uploads
      PARTY_JWT_SECRET: ${PARTY_JWT_SECRET:?请在.env中设置至少32字节随机密钥}
      PARTY_NOTICE_WECOM_SECRET: ${PARTY_NOTICE_WECOM_SECRET:-}
      PARTY_NOTICE_DINGTALK_SECRET: ${PARTY_NOTICE_DINGTALK_SECRET:-}
      PARTY_NOTICE_SMS_KEY_ID: ${PARTY_NOTICE_SMS_KEY_ID:-}
      PARTY_NOTICE_SMS_KEY_SECRET: ${PARTY_NOTICE_SMS_KEY_SECRET:-}
      PARTY_NOTICE_SMTP_PASSWORD: ${PARTY_NOTICE_SMTP_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      # 持久化存储三会一课纪要、证明材料、党员档案附件
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - party-network

  # 3. 前端界面与数字指挥大屏 (Vue 3 + Nginx 静态托管与反向代理)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: party-building-frontend:1.0.0
    container_name: party-vue-frontend
    restart: always
    security_opt:
      - seccomp:unconfined
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - party-network

volumes:
  pg_data:
    name: party_pg_data
  uploads_data:
    name: party_uploads_data

networks:
  party-network:
    name: party_network
    driver: bridge
