server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: party-building-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/honghe_party_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: HonghePartyHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.honghe.party.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 系统业务配置 (本地存储，零 MinIO / 零 Redis 纯轻量化)
party:
  storage:
    type: local
    local-path: ${PARTY_UPLOAD_PATH:./uploads}
  jwt:
    secret: ${PARTY_JWT_SECRET:}
    expire-seconds: 7200
